name: Actualizar guía EPG combinada

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clonar iptv-org/epg (el grabber)
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-tool

      - name: Instalar dependencias del grabber
        working-directory: epg-tool
        run: npm install

      # Si una fuente falla o tarda demasiado, las demás se siguen usando.
      # El timeout evita que un grabber colgado deje la guía sin actualizar.
      - name: Descargar guía de gatotv.com para mis canales
        continue-on-error: true
        working-directory: epg-tool
        run: |
          timeout 900 npm run grab -- \
            --channels=../channels/mis_canales_channels.xml \
            --output=../gatotv_guide.xml \
            --days=3

      - name: Descargar guía en vivo de m3u4u
        env:
          M3U4U_EPG_URL: ${{ secrets.M3U4U_EPG_URL }}
        run: |
          if [ -z "$M3U4U_EPG_URL" ]; then
            echo "::warning::Falta el secret M3U4U_EPG_URL en este repositorio (Settings → Secrets and variables → Actions). Se sigue sin esa fuente."
          elif ! curl -fsSL --retry 2 --retry-delay 5 --max-time 300 "$M3U4U_EPG_URL" -o m3u4u_guide.xml; then
            echo "::warning::No se pudo descargar la guía de m3u4u. Se sigue sin esa fuente."
            rm -f m3u4u_guide.xml
          fi

      - name: Descargar guías de epgshare01.online (México + Latinoamérica)
        run: |
          declare -A paises=(
            [MX1]=mexico
            [AR1]=argentina
            [BR1]=brasil1
            [BR2]=brasil2
            [CL1]=chile
            [CO1]=colombia
            [CR1]=costa_rica
            [DO1]=republica_dominicana
            [EC1]=ecuador
            [PA1]=panama
            [PE1]=peru
            [SV1]=el_salvador
            [UY1]=uruguay
          )
          for codigo in "${!paises[@]}"; do
            nombre="${paises[$codigo]}"
            echo "=== Descargando $nombre ($codigo) ==="
            if curl -fsSL --retry 2 --retry-delay 5 --max-time 300 "https://epgshare01.online/epgshare01/epg_ripper_${codigo}.xml.gz" -o "epgshare_${nombre}.xml.gz"; then
              gunzip -f "epgshare_${nombre}.xml.gz" || echo "::warning::No se pudo descomprimir $nombre"
            else
              echo "::warning::No se pudo descargar $nombre ($codigo); se sigue sin esa fuente."
              rm -f "epgshare_${nombre}.xml.gz"
            fi
          done

      - name: Descargar guías de iptv-epg.org (países de Latinoamérica que faltaban)
        run: |
          declare -A paises=(
            [bo]=bolivia
            [gt]=guatemala
            [hn]=honduras
            [ni]=nicaragua
            [py]=paraguay
            [ve]=venezuela
          )
          for codigo in "${!paises[@]}"; do
            nombre="${paises[$codigo]}"
            echo "=== Descargando $nombre ($codigo) ==="
            if ! curl -fsSL --retry 2 --retry-delay 5 --max-time 300 "https://iptv-epg.org/files/epg-${codigo}.xml" -o "iptvepg_${nombre}.xml"; then
              echo "::warning::No se pudo descargar $nombre ($codigo); se sigue sin esa fuente."
              rm -f "iptvepg_${nombre}.xml"
            fi
          done

      - name: Descargar guía de EPGTalk (Latino/México, 607 canales extra)
        run: |
          if curl -fsSL --retry 2 --retry-delay 5 --max-time 300 "https://raw.githubusercontent.com/acidjesuz/EPGTalk/master/Latino_guide.xml.gz" -o epgtalk_latino.xml.gz; then
            gunzip -f epgtalk_latino.xml.gz || echo "::warning::No se pudo descomprimir EPGTalk"
          else
            echo "::warning::No se pudo descargar EPGTalk; se sigue sin esa fuente."
            rm -f epgtalk_latino.xml.gz
          fi

      # Guías de APOYO ("donantes"): NO agregan canales a tu guía; solo se
      # usan para rellenar canales que sigan sin programación (por nombre).
      # Si alguna no se puede descargar, solo avisa y se sigue sin ella.
      - name: Descargar guías de apoyo (donantes)
        run: |
          mkdir -p donantes
          descargar() {
            nombre="$1"
            url="$2"
            if [[ "$url" == *.gz ]]; then
              if curl -fsSL --retry 2 --retry-delay 5 --max-time 300 "$url" -o "donantes/${nombre}.xml.gz"; then
                gunzip -f "donantes/${nombre}.xml.gz" || { echo "::warning::No se pudo descomprimir $nombre"; rm -f "donantes/${nombre}.xml.gz" "donantes/${nombre}.xml"; }
              else
                echo "::warning::No se pudo descargar la guía de apoyo $nombre; se sigue sin ella."
                rm -f "donantes/${nombre}.xml.gz"
              fi
            else
              curl -fsSL --retry 2 --retry-delay 5 --max-time 300 "$url" -o "donantes/${nombre}.xml" || { echo "::warning::No se pudo descargar la guía de apoyo $nombre; se sigue sin ella."; rm -f "donantes/${nombre}.xml"; }
            fi
          }
          descargar us2 "https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz"
          descargar us_sports "https://epgshare01.online/epgshare01/epg_ripper_US_SPORTS1.xml.gz"
          descargar plex "https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/Plex/all.xml.gz"
          descargar samsung "https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/SamsungTVPlus/all.xml.gz"
          descargar espana "https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml"
          ls -la donantes || true

      - name: Generar guía genérica para canales sin fuente externa (65 temáticos/FAST)
        run: python3 scripts/generate_extra_epg.py --output extra_epg.xml --days 3

      # Orden = prioridad (gana el primero). Después: canales vacíos se rellenan
      # con los de otro canal del mismo nombre (donantes incluidas) y los
      # HUECOS entre programas se rellenan con bloques "Programación regular"
      # (ver scripts/merge_epg.py). Para ver cuáles de TU lista siguen sin
      # programación, agrega abajo la línea:   --m3u "URL_O_ARCHIVO.m3u" \
      - name: Combinar todas las guías en una sola
        run: |
          python3 scripts/merge_epg.py \
            --output guide.xml \
            --roku-output guide_roku.xml \
            --roku-fast-output guide_roku_now.xml \
            --empty-report empty_channels.txt \
            --gzip \
            --forward-hours 72 \
            --max-mb 95 \
            gatotv_guide.xml \
            m3u4u_guide.xml \
            epgshare_*.xml \
            iptvepg_*.xml \
            epgtalk_*.xml \
            extra_epg.xml \
            --donors donantes/*.xml

      - name: Verificar que las guías de la app salieron bien
        run: |
          for f in guide_roku.xml guide_roku_now.xml guide.xml.gz; do
            if [ ! -s "$f" ]; then
              echo "::error::Falta $f o está vacío; no se sube nada hoy."
              exit 1
            fi
          done

      - name: Limpiar archivos intermedios
        run: rm -rf donantes gatotv_guide.xml m3u4u_guide.xml epgshare_*.xml iptvepg_*.xml epgtalk_*.xml extra_epg.xml

      # Solo se suben el .gz y las guías de la app. guide.xml (sin comprimir,
      # hasta 95 MB) se borra: subirlo cada día haría crecer el repo sin control.
      - name: Commitear y subir la guía combinada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f guide.xml
          git add guide.xml.gz guide_roku.xml guide_roku_now.xml empty_channels.txt
          if git diff --staged --quiet; then
            echo "Sin cambios en la guía hoy, no hay nada que commitear."
          else
            git commit -m "Actualiza guía EPG combinada [automático]"
            git push
          fi
