name: Actualizar guía EPG combinada

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clonar iptv-org/epg (el grabber)
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-tool

      - name: Instalar dependencias del grabber
        working-directory: epg-tool
        run: npm install

      # Si una fuente falla, las demás se siguen usando (antes una sola
      # fuente caída tumbaba toda la Action y la guía quedaba vieja).
      - name: Descargar guía de gatotv.com para mis canales
        continue-on-error: true
        working-directory: epg-tool
        run: |
          npm run grab -- \
            --channels=../channels/mis_canales_channels.xml \
            --output=../gatotv_guide.xml \
            --days=3

      - name: Descargar guía en vivo de m3u4u
        env:
          M3U4U_EPG_URL: ${{ secrets.M3U4U_EPG_URL }}
        run: |
          if [ -z "$M3U4U_EPG_URL" ]; then
            echo "::warning::Falta el secret M3U4U_EPG_URL en este repositorio (Settings → Secrets and variables → Actions). Se sigue sin esa fuente."
          elif ! curl -fsSL "$M3U4U_EPG_URL" -o m3u4u_guide.xml; then
            echo "::warning::No se pudo descargar la guía de m3u4u. Se sigue sin esa fuente."
            rm -f m3u4u_guide.xml
          fi

      - name: Descargar guías de epgshare01.online (México + Latinoamérica)
        run: |
          declare -A paises=(
            [MX1]=mexico
            [AR1]=argentina
            [BR1]=brasil1
            [BR2]=brasil2
            [CL1]=chile
            [CO1]=colombia
            [CR1]=costa_rica
            [DO1]=republica_dominicana
            [EC1]=ecuador
            [PA1]=panama
            [PE1]=peru
            [SV1]=el_salvador
            [UY1]=uruguay
          )
          for codigo in "${!paises[@]}"; do
            nombre="${paises[$codigo]}"
            echo "=== Descargando $nombre ($codigo) ==="
            if curl -fsSL "https://epgshare01.online/epgshare01/epg_ripper_${codigo}.xml.gz" -o "epgshare_${nombre}.xml.gz"; then
              gunzip -f "epgshare_${nombre}.xml.gz" || echo "::warning::No se pudo descomprimir $nombre"
            else
              echo "::warning::No se pudo descargar $nombre ($codigo); se sigue sin esa fuente."
              rm -f "epgshare_${nombre}.xml.gz"
            fi
          done

      - name: Descargar guías de iptv-epg.org (países de Latinoamérica que faltaban)
        run: |
          declare -A paises=(
            [bo]=bolivia
            [gt]=guatemala
            [hn]=honduras
            [ni]=nicaragua
            [py]=paraguay
            [ve]=venezuela
          )
          for codigo in "${!paises[@]}"; do
            nombre="${paises[$codigo]}"
            echo "=== Descargando $nombre ($codigo) ==="
            if ! curl -fsSL "https://iptv-epg.org/files/epg-${codigo}.xml" -o "iptvepg_${nombre}.xml"; then
              echo "::warning::No se pudo descargar $nombre ($codigo); se sigue sin esa fuente."
              rm -f "iptvepg_${nombre}.xml"
            fi
          done

      - name: Descargar guía de EPGTalk (Latino/México, 607 canales extra)
        run: |
          if curl -fsSL "https://raw.githubusercontent.com/acidjesuz/EPGTalk/master/Latino_guide.xml.gz" -o epgtalk_latino.xml.gz; then
            gunzip -f epgtalk_latino.xml.gz || echo "::warning::No se pudo descomprimir EPGTalk"
          else
            echo "::warning::No se pudo descargar EPGTalk; se sigue sin esa fuente."
            rm -f epgtalk_latino.xml.gz
          fi

      - name: Generar guía genérica para canales sin fuente externa (65 temáticos/FAST)
        run: python3 scripts/generate_extra_epg.py --output extra_epg.xml --days 3

      # Orden = prioridad (gana el primero). Además, los canales que
      # queden SIN programas se rellenan con los de otro canal del mismo
      # nombre de cualquiera de estas fuentes (ver scripts/merge_epg.py).
      # Para ver cuáles de TU lista siguen sin programación, agrega abajo
      # la línea:   --m3u "URL_O_ARCHIVO_DE_TU_LISTA.m3u" \
      - name: Combinar todas las guías en una sola
        run: |
          python3 scripts/merge_epg.py \
            --output guide.xml \
            --roku-output guide_roku.xml \
            --gzip \
            --forward-hours 72 \
            --max-mb 95 \
            gatotv_guide.xml \
            m3u4u_guide.xml \
            epgshare_*.xml \
            iptvepg_*.xml \
            epgtalk_*.xml \
            extra_epg.xml

      - name: Limpiar archivos intermedios
        run: rm -f gatotv_guide.xml m3u4u_guide.xml epgshare_*.xml iptvepg_*.xml epgtalk_*.xml extra_epg.xml

      - name: Commitear y subir la guía combinada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guide.xml guide.xml.gz guide_roku.xml
          if git diff --staged --quiet; then
            echo "Sin cambios en la guía hoy, no hay nada que commitear."
          else
            git commit -m "Actualiza guía EPG combinada [automático]"
            git push
          fi
